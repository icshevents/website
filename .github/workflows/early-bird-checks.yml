name: Early Bird Discounts validation
on:
  push:
    branches:
      - feature/early-bird-discounts
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Early Bird and affected booking regression tests (no live connections)
        run: node --test tests/event-discounts.test.mjs tests/booking-api.test.mjs tests/booking-pricing.test.mjs tests/event-child-tickets.test.mjs tests/ticket-confirmation-emails.test.mjs tests/form-emails.test.mjs tests/iftari-bookings.test.mjs tests/events-hub.test.mjs tests/events-hub-database.test.mjs
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Next.js build
        run: pnpm build
      - name: Full legacy suite (reports pre-existing membership and UK-date expectation failures)
        continue-on-error: true
        run: pnpm test
